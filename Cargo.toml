[workspace]
members = [
  ".",
  "crates/riced-extension-sdk",
  "extensions/system",
  "extensions/wayland",
  "extensions/dbus",
  "extensions/themeagen",
  "extensions/lucide",
  "extensions/openmeteo",
]
resolver = "3"

[package]
name = "riced-replanted"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riced"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mlua = { version = "0.12", features = [
  "lua54",
  "vendored",
  "send",
  "macros",
  "serialize",
] }
iced = { version = "0.14.0", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
  "markdown",
  "lazy",
  "qr_code",
  "wayland",
] }
iced_anim = { version = "0.3.1", features = ["derive"] }
iced_exwlshell = "0.20.1"
riced-extension-sdk = { path = "crates/riced-extension-sdk", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
