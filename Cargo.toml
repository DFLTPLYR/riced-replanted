[workspace]
members = [".", "crates/riced-extension-sdk", "extensions/system", "extensions/wayland", "extensions/dbus"]
resolver = "3"

[package]
name = "riced-replanted"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riced"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.12", features = [
  "lua54",
  "vendored",
  "send",
  "macros",
  "serialize",
] }
iced = { version = "0.14.0", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
  "markdown",
  "qr_code",
  "wayland",
] }
iced_runtime = "0.14.0"
iced_anim = { version = "0.3.1", features = ["derive"] }
iced_exwlshell = "0.20.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2"
iced_wayland_subscriber = "0.20.1"
wayland-client = "0.31.15"
riced-extension-sdk = { path = "crates/riced-extension-sdk", default-features = false }
serde_json = "1"
toml = "0.8"
