edition = "2024"

[[bin]]
name = "riced-openmeteo"
path = "src/main.rs"

[dependencies]
riced-extension-sdk = { path = "../../crates/riced-extension-sdk", features = ["process"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
