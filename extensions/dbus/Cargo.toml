[package]
name = "riced-extension-dbus"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riced-dbus"
path = "src/main.rs"

[dependencies]
riced-extension-sdk = { path = "../../crates/riced-extension-sdk", features = ["process"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
