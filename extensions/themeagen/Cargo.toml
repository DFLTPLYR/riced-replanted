[package]
name = "riced-extension-themeagen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riced-themeagen"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
material-colors = { version = "0.4", features = ["image"] }
riced-extension-sdk = { path = "../../crates/riced-extension-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
