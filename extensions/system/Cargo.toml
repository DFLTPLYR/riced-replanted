[package]
name = "riced-extension-system"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riced-system"
path = "src/main.rs"

[dependencies]
libc = "0.2"
riced-extension-sdk = { path = "../../crates/riced-extension-sdk" }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
